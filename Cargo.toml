[workspace]
members = [
  "crates/crabgram",
  "crates/crabgram-build",
  "crates/crabgram-macros",
  "crates/crabgram-standalone",
  "crates/crabgram-styling",
]
resolver = "3"
exclude = ["template"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["kimhappy <babtul21@gmail.com>"]
publish = false
repository = "https://github.com/kimhappy/crabgram"

[workspace.dependencies]
crabgram = { path = "crates/crabgram" }
crabgram-macros = { path = "crates/crabgram-macros" }
crabgram-styling = { path = "crates/crabgram-styling" }
ab_glyph = "0.2"
bindgen = "0.72"
cargo_metadata = "0.23"
cpal = "0.16"
libloading = "0.8"
png = "0.18"
proc-macro-crate = "3"
ringbuf = "0.4"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
softbuffer = { version = "0.4", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "x11-dlopen"] }
syn = "2"
resvg = { version = "0.48", default-features = false }
thiserror = { version = "2", default-features = false }
tiny-skia = "0.12"
trybuild = "1"
winit = "0.30"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
multiple_crate_versions = "allow"
suboptimal_flops = "allow"
undocumented_unsafe_blocks = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.rust]
incomplete_features = "allow"
missing_docs = "warn"

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
